[project]
name = "d3jusdevspace-backend"
version = "0.1.0"
description = "FastAPI backend for d3jusdevspace — personal AI knowledge hub"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.136.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.40",
    "asyncpg>=0.30.0",
    "alembic>=1.15.0",
    # Auth
    "pyjwt[crypto]>=2.9.0",
    # Utilities
    "python-slugify>=8.0.4",
    "psycopg[binary]>=3.3.3",
    "cloudinary>=1.44.2",
    "python-multipart>=0.0.26",
    # Vector search
    "pgvector>=0.4.2",
    "httpx>=0.28.0",
    # Agent pipeline
    "langgraph>=0.2.0",
    "langchain-groq>=0.1.0",
    "tavily-python>=0.3.0",
    "apscheduler>=3.10.0",
    "langfuse>=2.0.0",
]
